<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ModernERP Loading</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1e293b;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow: hidden;
    }

    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 0 8px 32px rgba(99, 102, 241, 0.4);
      margin-bottom: 8px;
    }

    .brand {
      font-size: 13px;
      font-weight: 600;
      color: #6366f1;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .app-name {
      font-size: 32px;
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: -0.5px;
    }

    .tagline {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .spinner-wrap {
      margin: 24px 0 16px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #334155;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #status {
      font-size: 13px;
      color: #94a3b8;
      text-align: center;
      min-height: 20px;
      transition: opacity 0.2s;
      max-width: 340px;
    }

    .footer {
      position: absolute;
      bottom: 20px;
      font-size: 11px;
      color: #475569;
      text-align: center;
    }

    .version {
      position: absolute;
      top: 16px;
      right: 16px;
      font-size: 11px;
      color: #475569;
    }
  </style>
</head>
<body>
  <span class="version">v1.0.0</span>

  <div class="logo-area">
    <div class="logo-icon">🏪</div>
    <span class="brand">BROcode Solutions</span>
    <span class="app-name">ModernERP</span>
    <span class="tagline">Retail Management System</span>
  </div>

  <div class="spinner-wrap">
    <div class="spinner"></div>
  </div>

  <div id="status">Initializing...</div>

  <div class="footer">Powered by BROcode Solutions &nbsp;·&nbsp; ACM Groceries</div>
</body>
</html>
