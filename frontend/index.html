<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BROcode ERP</title>
    <!-- Anti-FOUC: resolve theme from saved choice (or OS preference) and stamp
         <html data-theme> before first paint, so there is no flash of the wrong
         theme on load. Mirrors ThemeProvider's resolution logic. -->
    <script>
      (function () {
        try {
          var choice = localStorage.getItem('erp_theme') || 'system';
          var dark = choice === 'dark' ||
            (choice === 'system' &&
             window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
