# ── BROcode ERP — nginx config (frontend container) ───────────────────────────
# Serves the React SPA and reverse-proxies API + uploads to the backend service.
# `backend` resolves to the backend container via the compose network.

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Reasonable upload ceiling — base64 images can be large (matches the
    # backend's express.json 10mb limit).
    client_max_body_size 12m;

    # Gzip text assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # API → backend.
    location /api/ {
        proxy_pass         http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Authenticated file downloads are served by the backend.
    location /uploads/ {
        proxy_pass         http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Health probes proxied to the backend.
    location = /health        { proxy_pass http://backend:4000; }
    location = /health/ready  { proxy_pass http://backend:4000; }

    # SPA fallback — every other path serves index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
